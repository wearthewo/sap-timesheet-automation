name: workforce
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workforce
      POSTGRES_USER: ${DATABASE_USERNAME:-workforce}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-keycloak.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d workforce"]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${DATABASE_USERNAME:-workforce}
      KC_DB_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports: ["127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"]
    volumes:
      - ./infra/keycloak/workforce-realm.json:/opt/keycloak/data/import/workforce-realm.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  mock-sap:
    build: ./mock-sap
    environment:
      PORT: "8090"
      SAP_API_TOKEN: ${SAP_API_TOKEN:?Set SAP_API_TOKEN in .env}
    volumes:
      - mock_sap_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/workforce
      DATABASE_USERNAME: ${DATABASE_USERNAME:-workforce}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/workforce}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/workforce/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: workforce-api
      SAP_BASE_URL: ${SAP_BASE_URL:-http://mock-sap:8090}
      SAP_API_TOKEN: ${SAP_API_TOKEN:?Set SAP_API_TOKEN}
      SAP_EXPORT_WORKER_ENABLED: ${SAP_EXPORT_WORKER_ENABLED:-true}
      SAP_EXPORT_BATCH_SIZE: ${SAP_EXPORT_BATCH_SIZE:-5}
      SAP_EXPORT_POLL_INTERVAL: ${SAP_EXPORT_POLL_INTERVAL:-5s}
      SAP_EXPORT_MAX_ATTEMPTS: ${SAP_EXPORT_MAX_ATTEMPTS:-4}
      SAP_EXPORT_INITIAL_BACKOFF: ${SAP_EXPORT_INITIAL_BACKOFF:-30s}
      SAP_EXPORT_MAX_BACKOFF: ${SAP_EXPORT_MAX_BACKOFF:-10m}
      SAP_EXPORT_PROCESSING_TIMEOUT: ${SAP_EXPORT_PROCESSING_TIMEOUT:-5m}
      SAP_RECONCILIATION_INTERVAL: ${SAP_RECONCILIATION_INTERVAL:-30s}
      SAP_CONNECT_TIMEOUT: ${SAP_CONNECT_TIMEOUT:-2s}
      SAP_RESPONSE_TIMEOUT: ${SAP_RESPONSE_TIMEOUT:-5s}
      MAX_DAILY_HOURS: ${MAX_DAILY_HOURS:-24}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  frontend:
    build: ./frontend
    environment:
      PORT: "3000"
      NEXTAUTH_URL: ${FRONTEND_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
      BACKEND_API_URL: http://backend:8080
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/workforce}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/workforce
      KEYCLOAK_CLIENT_ID: workforce-web
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET}
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  mock_sap_data:
