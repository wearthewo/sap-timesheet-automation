server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    test-connection: false
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:false}
      mail.smtp.connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:3000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:3000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:3000}
  application:
    name: workforce
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/workforce}
    username: ${DATABASE_USERNAME:workforce}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/workforce}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/workforce/protocol/openid-connect/certs}
          audiences: ${KEYCLOAK_AUDIENCE:workforce-api}
  data:
    web:
      pageable:
        max-page-size: 100
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  notifications:
    public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:3000}
    business-timezone: ${WORKFORCE_BUSINESS_TIMEZONE:Europe/Athens}
    mail-from: ${MAIL_FROM:noreply@workforce.local}
    scheduler-enabled: ${NOTIFICATION_SCHEDULER_ENABLED:false}
    evaluation-interval: ${NOTIFICATION_EVALUATION_INTERVAL:PT15M}
    timesheet-reminder-day: ${TIMESHEET_REMINDER_DAY_OF_MONTH:28}
    finance-reminder-day: ${FINANCE_REMINDER_DAY_OF_MONTH:5}
    worker-enabled: ${NOTIFICATION_WORKER_ENABLED:false}
    batch-size: ${NOTIFICATION_BATCH_SIZE:10}
    poll-interval: ${NOTIFICATION_POLL_INTERVAL:PT5S}
    processing-timeout: ${NOTIFICATION_PROCESSING_TIMEOUT:PT5M}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:4}
    initial-backoff: ${NOTIFICATION_INITIAL_BACKOFF:PT30S}
    max-backoff: ${NOTIFICATION_MAX_BACKOFF:PT10M}
  reporting:
    max-download-rows: ${REPORT_MAX_DOWNLOAD_ROWS:10000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  timesheets:
    max-daily-hours: ${MAX_DAILY_HOURS:24}

  sap:
    base-url: ${SAP_BASE_URL:}
    api-token: ${SAP_API_TOKEN:}
    connect-timeout: ${SAP_CONNECT_TIMEOUT:2s}
    response-timeout: ${SAP_RESPONSE_TIMEOUT:5s}
    worker:
      enabled: ${SAP_EXPORT_WORKER_ENABLED:false}
      batch-size: ${SAP_EXPORT_BATCH_SIZE:5}
      poll-interval: ${SAP_EXPORT_POLL_INTERVAL:5s}
      max-attempts: ${SAP_EXPORT_MAX_ATTEMPTS:4}
      initial-backoff: ${SAP_EXPORT_INITIAL_BACKOFF:30s}
      max-backoff: ${SAP_EXPORT_MAX_BACKOFF:10m}
      processing-timeout: ${SAP_EXPORT_PROCESSING_TIMEOUT:5m}
      reconciliation-interval: ${SAP_RECONCILIATION_INTERVAL:30s}
