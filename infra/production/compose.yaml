# Independent deployment; never combine with the development or CI Compose file.
x-runtime: &runtime
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
  stop_grace_period: 45s
services:
  proxy:
    <<: *runtime
    image: workforce-proxy:${RELEASE_TAG:?Set RELEASE_TAG}
    build: {context: ../.., dockerfile: infra/production/caddy.Dockerfile}
    platform: ${PLATFORM:?Set PLATFORM}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 256m
    cpus: 0.5
    sysctls: {net.ipv4.ip_unprivileged_port_start: "0"}
    ports: ["${PUBLIC_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80", "${PUBLIC_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"]
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST}
      AUTH_HOST: ${AUTH_HOST:?Set AUTH_HOST}
      TLS_CONFIG: ${TLS_CONFIG:?Set certificate contact}
    volumes: [caddy_data:/data, caddy_config:/config]
    networks:
      ingress: {ipv4_address: "${PROXY_IP:-172.29.10.254}", aliases: ["${APP_HOST}", "${AUTH_HOST}"]}
      outbound: {}
    depends_on:
      frontend: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"], interval: 15s, timeout: 5s, retries: 5}
  postgres:
    # Official PostgreSQL root/entrypoint; only gosu is rebuilt with patched Go.
    # Starts as root to initialize/chown, then drops to postgres.
    restart: unless-stopped
    image: workforce-postgres:${RELEASE_TAG:?Set RELEASE_TAG}
    build: {context: ../.., dockerfile: infra/production/postgres.Dockerfile}
    platform: ${PLATFORM}
    security_opt: ["no-new-privileges:true"]
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
    stop_grace_period: 60s
    mem_limit: 1536m
    cpus: 1.0
    shm_size: 256m
    environment: {POSTGRES_USER: postgres, POSTGRES_DB: postgres, POSTGRES_PASSWORD_FILE: /run/secrets/PG_ADMIN_PASSWORD}
    secrets: [PG_ADMIN_PASSWORD, DATABASE_PASSWORD, KEYCLOAK_DB_PASSWORD]
    volumes: [postgres_data:/var/lib/postgresql/data, "./postgres-init.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro"]
    networks: [services]
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=80", "-c", "log_statement=none", "-c", "log_min_error_statement=panic"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"], interval: 5s, timeout: 5s, retries: 30}
  keycloak:
    <<: *runtime
    image: workforce-keycloak:${RELEASE_TAG}
    build: {context: ../.., dockerfile: infra/production/keycloak.Dockerfile}
    platform: ${PLATFORM}
    mem_limit: 1280m
    cpus: 1.5
    tmpfs: ["/tmp:size=128m,mode=1777"]
    environment:
      SECRET_NAMES: KEYCLOAK_DB_PASSWORD KEYCLOAK_ADMIN_PASSWORD KEYCLOAK_CLIENT_SECRET SMTP_PASSWORD
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_POOL_MAX_SIZE: "10"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set private admin name}
      KC_HOSTNAME: https://${AUTH_HOST}
      KC_HOSTNAME_STRICT: "true"
      KC_TLS_HOSTNAME_VERIFIER: DEFAULT
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${PROXY_IP:-172.29.10.254}
      KC_HTTP_MAX_QUEUED_REQUESTS: "100"
      KC_HTTP_MAX_THREADS: "30"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m -XX:ActiveProcessorCount=2
      FRONTEND_URL: https://${APP_HOST}
      KEYCLOAK_SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      KEYCLOAK_SMTP_PORT: ${SMTP_PORT:-587}
      KEYCLOAK_SMTP_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      KEYCLOAK_SMTP_AUTH: "true"
      KEYCLOAK_SMTP_STARTTLS: "true"
      KEYCLOAK_SMTP_SSL: "false"
      KEYCLOAK_SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
    secrets: [KEYCLOAK_DB_PASSWORD, KEYCLOAK_ADMIN_PASSWORD, KEYCLOAK_CLIENT_SECRET, SMTP_PASSWORD]
    networks: [ingress, services, outbound]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q \"HTTP/1.[01] 200\"'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 40s
  backend:
    <<: *runtime
    image: workforce-backend:${RELEASE_TAG}
    build: {context: ../.., dockerfile: infra/production/backend.Dockerfile}
    platform: ${PLATFORM}
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 1536m
    cpus: 1.5
    environment:
      SECRET_NAMES: DATABASE_PASSWORD SAP_API_TOKEN INVITATION_SIGNING_KEY SMTP_PASSWORD
      JAVA_TOOL_OPTIONS: -Xmx768m -XX:ActiveProcessorCount=2
      DATABASE_URL: jdbc:postgresql://postgres:5432/workforce
      DATABASE_USERNAME: workforce
      LEGACY_TENANT_CONFIRMED: "false"
      KEYCLOAK_ISSUER_URI: https://${AUTH_HOST}/realms/workforce
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/workforce/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: workforce-api
      APP_PUBLIC_BASE_URL: https://${APP_HOST}
      CORS_ALLOWED_ORIGINS: https://${APP_HOST}
      WORKFORCE_BUSINESS_TIMEZONE: Europe/Athens
      SAP_BASE_URL: http://mock-sap:8090
      SAP_EXPORT_WORKER_ENABLED: "true"
      SAP_CONNECT_TIMEOUT: 2s
      SAP_RESPONSE_TIMEOUT: 5s
      SAP_EXPORT_BATCH_SIZE: "3"
      SAP_EXPORT_POLL_INTERVAL: 5s
      SAP_EXPORT_MAX_ATTEMPTS: "4"
      SAP_EXPORT_INITIAL_BACKOFF: 30s
      SAP_EXPORT_MAX_BACKOFF: 10m
      SAP_EXPORT_PROCESSING_TIMEOUT: 5m
      SAP_RECONCILIATION_INTERVAL: 30s
      NOTIFICATION_WORKER_ENABLED: "true"
      NOTIFICATION_SCHEDULER_ENABLED: "true"
      NOTIFICATION_BATCH_SIZE: "5"
      NOTIFICATION_POLL_INTERVAL: PT5S
      NOTIFICATION_EVALUATION_INTERVAL: PT15M
      MAIL_HOST: ${SMTP_HOST}
      MAIL_PORT: ${SMTP_PORT:-587}
      MAIL_USERNAME: ${SMTP_USERNAME}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_SMTP_AUTH: "true"
      MAIL_STARTTLS_ENABLED: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_CHECKSERVERIDENTITY: "true"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,db
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
      SERVER_FORWARD_HEADERS_STRATEGY: none
    secrets: [DATABASE_PASSWORD, SAP_API_TOKEN, INVITATION_SIGNING_KEY, SMTP_PASSWORD]
    networks: [services, outbound]
    depends_on: {postgres: {condition: service_healthy}, keycloak: {condition: service_healthy}}
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q \"HTTP/1.[01] 200\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
  frontend:
    <<: *runtime
    image: workforce-frontend:${RELEASE_TAG}
    build: {context: ../.., dockerfile: infra/production/frontend.Dockerfile}
    platform: ${PLATFORM}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 768m
    cpus: 1.0
    environment:
      SECRET_NAMES: NEXTAUTH_SECRET KEYCLOAK_CLIENT_SECRET
      NODE_OPTIONS: --max-old-space-size=512
      NEXTAUTH_URL: https://${APP_HOST}
      BACKEND_API_URL: http://backend:8080
      KEYCLOAK_ISSUER_URI: https://${AUTH_HOST}/realms/workforce
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/workforce
      KEYCLOAK_CLIENT_ID: workforce-web
    secrets: [NEXTAUTH_SECRET, KEYCLOAK_CLIENT_SECRET]
    networks: [ingress, services]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10}
  mock-sap:
    <<: *runtime
    image: workforce-mock-sap:${RELEASE_TAG}
    build: {context: ../.., dockerfile: infra/production/mock-sap.Dockerfile}
    platform: ${PLATFORM}
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 256m
    cpus: 0.5
    environment: {SECRET_NAMES: SAP_API_TOKEN}
    secrets: [SAP_API_TOKEN]
    volumes: [mock_sap_data:/data]
    networks: [services]
    healthcheck: {test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10}
networks:
  ingress:
    internal: true
    ipam: {config: [{subnet: "${INGRESS_SUBNET:-172.29.10.0/24}"}]}
  services: {internal: true}
  outbound: {}
volumes:
  postgres_data:
  mock_sap_data:
  caddy_data:
  caddy_config:
secrets:
  PG_ADMIN_PASSWORD: {file: "${SECRET_DIR:?Set SECRET_DIR}/PG_ADMIN_PASSWORD"}
  DATABASE_PASSWORD: {file: "${SECRET_DIR}/DATABASE_PASSWORD"}
  KEYCLOAK_DB_PASSWORD: {file: "${SECRET_DIR}/KEYCLOAK_DB_PASSWORD"}
  KEYCLOAK_ADMIN_PASSWORD: {file: "${SECRET_DIR}/KEYCLOAK_ADMIN_PASSWORD"}
  KEYCLOAK_CLIENT_SECRET: {file: "${SECRET_DIR}/KEYCLOAK_CLIENT_SECRET"}
  NEXTAUTH_SECRET: {file: "${SECRET_DIR}/NEXTAUTH_SECRET"}
  SAP_API_TOKEN: {file: "${SECRET_DIR}/SAP_API_TOKEN"}
  INVITATION_SIGNING_KEY: {file: "${SECRET_DIR}/INVITATION_SIGNING_KEY"}
  SMTP_PASSWORD: {file: "${SECRET_DIR}/SMTP_PASSWORD"}
