# Install as /etc/ssh/sshd_config.d/00-workforce.conf only after testing a second sudo/key session.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
MaxAuthTries 3
LoginGraceTime 30
# Keep PAM/session handling and SFTP defaults from Ubuntu. Validate sshd -t and sshd -T.
