name: Prepare immutable release review artifacts
on:
  workflow_dispatch:
    inputs:
      policy:
        description: Candidate contains no approvals; select the intended review environment
        type: choice
        required: true
        default: public-saas
        options: [public-saas, private-demo]
permissions:
  contents: read
  actions: read
concurrency:
  group: private-demo-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.policy == 'public-saas' && 'production-publish' || 'private-demo-publish' }}
    runs-on: ubuntu-24.04
    # Includes the maintained Keycloak source build, bounded to 40 minutes itself.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLIC_PRODUCTION_TRUST_JSON: ${{ vars.PUBLIC_PRODUCTION_TRUST_JSON }}
      REVIEW_ENVIRONMENT: ${{ inputs.policy == 'public-saas' && 'production-publish' || 'private-demo-publish' }}
      TRIVY: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version-file: .nvmrc}
      - run: node infra/production/release-gates.mjs "$GITHUB_SHA" "$REVIEW_ENVIRONMENT"
      - name: Build once and retain full unfiltered evidence without publishing
        shell: bash
        run: |
          set -euo pipefail
          directory="$PWD/.verification/private-demo"
          docker buildx create --name private-demo-builder --driver docker-container \
            --driver-opt memory=3g --driver-opt cpu-period=100000 --driver-opt cpu-quota=200000 --use
          trap 'docker buildx rm private-demo-builder' EXIT
          mkdir -p "$directory/scans" "$directory/sboms" "$directory/cache"
          docker run --rm -v "$directory/cache:/root/.cache/trivy" "$TRIVY" image --download-db-only
          docker run --rm -v "$directory/cache:/root/.cache/trivy" "$TRIVY" image --download-java-db-only --timeout 5m
          docker run --rm -v "$directory/cache:/root/.cache/trivy" "$TRIVY" --version --format json > "$directory/scanner.json"
          export BUILDX_METADATA_PROVENANCE=max
          for service in proxy backend frontend keycloak mock-sap backup postgres; do
            dockerfile="$service"
            if [ "$service" = proxy ]; then dockerfile=caddy; fi
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
              --metadata-file "$directory/$service-build.json" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --output "type=oci,dest=$directory/$service.tar" -f "infra/production/$dockerfile.Dockerfile" .
            # Trivy accepts OCI layouts, not OCI tar archives. Verify before safe extraction.
            python3 infra/production/oci-inventory.py "$directory/$service.tar" "$directory/$service-layout" > "$directory/$service-oci.json"
            docker run --rm --memory=1g -v "$directory:/evidence" -v "$directory/cache:/root/.cache/trivy" "$TRIVY" image \
              --input "/evidence/$service-layout" --skip-db-update --skip-java-db-update --timeout 5m --scanners vuln --list-all-pkgs \
              --format json --output "/evidence/scans/$service.json"
            docker run --rm --memory=1g -v "$directory:/evidence" -v "$directory/cache:/root/.cache/trivy" "$TRIVY" image \
              --input "/evidence/$service-layout" --skip-db-update --skip-java-db-update --timeout 5m --format cyclonedx \
              --output "/evidence/sboms/$service.json"
            df -h / | tail -n 1
          done
          node infra/production/private-demo-bundle.mjs create "$directory" "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: private-demo-candidate
          include-hidden-files: true
          compression-level: 0
          retention-days: 7
          path: |
            .verification/private-demo/*.tar
            .verification/private-demo/*.json
            .verification/private-demo/scans/
            .verification/private-demo/sboms/
