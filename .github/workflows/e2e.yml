name: Full-stack E2E
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  business-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=2048
      COMPOSE_PARALLEL_LIMIT: '1'
      # Keep assertions/timeouts intact while 12E initial-page-load reliability is investigated.
      PLAYWRIGHT_WORKERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Install browser tooling
        working-directory: frontend
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - run: node infra/ci/stack.mjs prepare
      - run: node infra/ci/stack.mjs config
      - name: Build and wait for all six services
        run: node infra/ci/stack.mjs start
      - name: Isolated per-spec OIDC users and database fixtures
        run: node infra/ci/stack.mjs seed
      - name: Full smoke and browser suite
        run: node infra/ci/stack.mjs test
      - name: Safe service and job diagnostics
        if: always()
        run: node infra/ci/stack.mjs diagnostics
      - name: Remove this run's isolated stack and volumes
        if: always()
        run: node infra/ci/stack.mjs stop
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: e2e-diagnostics
          path: |
            .verification/ci/diagnostics/
            .verification/ci/browser-results/
            frontend/test-results/
            frontend/playwright-report/
          include-hidden-files: true
          retention-days: 3
