name: Deploy approved Contabo release
on:
  workflow_dispatch:
    inputs:
      policy:
        description: Explicit target policy; private approvals never apply to public SaaS
        required: true
        default: public-saas
        type: choice
        options: [public-saas, private-demo]
      publish_run_id:
        description: 'Successful Publish reviewed AMD64 images run ID'
        required: true
        type: string
      confirmation:
        description: 'Type DEPLOY after reviewing backup, migrations, firewall and release manifest'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  provenance:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.check.outputs.revision }}
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_RUN: ${{ inputs.publish_run_id }}
      RELEASE_POLICY: ${{ inputs.policy }}
    steps:
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLISH_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN" > run.json
          node <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync('run.json'));
          const paths={'public-saas':'.github/workflows/production-publish.yml','private-demo':'.github/workflows/private-demo-publish.yml'};
          if(!paths[process.env.RELEASE_POLICY]||r.path!==paths[process.env.RELEASE_POLICY]||r.head_branch!=='main'||r.status!=='completed'||r.conclusion!=='success'||r.event!=='workflow_dispatch'||!/^[a-f0-9]{40}$/.test(r.head_sha)) throw Error('Untrusted or incomplete publishing run');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`revision=${r.head_sha}\n`);
          NODE
  deploy:
    needs: provenance
    environment: ${{ inputs.policy == 'private-demo' && 'private-demo' || 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REVISION: ${{ needs.provenance.outputs.revision }}
      PUBLISH_RUN: ${{ inputs.publish_run_id }}
      RELEASE_POLICY: ${{ inputs.policy }}
      TRUST_JSON: ${{ vars.PRIVATE_DEMO_TRUST_JSON }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.provenance.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version-file: .nvmrc}
      - name: Revalidate source gates and download immutable inventory
        run: |
          environment=production
          if [ "$RELEASE_POLICY" = private-demo ]; then environment=private-demo; fi
          node infra/production/release-gates.mjs "$REVISION" "$environment"
          gh run download "$PUBLISH_RUN" --repo "$GITHUB_REPOSITORY" --name production-release --dir .verification/release
          test "$(node infra/production/release.mjs check .verification/release/release.json)" = "$REVISION"
          if [ "$RELEASE_POLICY" = private-demo ]; then
            printf '%s' "$TRUST_JSON" > "$RUNNER_TEMP/demo-trust.json"
            node infra/production/private-demo-policy.mjs .verification/release .verification/release/approval.json "$RUNNER_TEMP/demo-trust.json" .verification/release/release.json
          else
            node -e 'if(JSON.parse(require("fs").readFileSync(".verification/release/release.json")).privateDemo)throw Error("Private policy cannot authorize public SaaS")'
            # Recheck every retained report under the exact revision's public policy.
            # Missing reports, UNKNOWN and HIGH/CRITICAL cannot pass via private approvals.
            for service in proxy backend frontend keycloak mock-sap backup postgres; do
              node infra/production/scan-verification.mjs ".verification/release/scans/$service.json"
            done
          fi
      - name: Request deployment through restricted SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]]
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          ssh -T -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "workforce-deploy@$DEPLOY_HOST" sudo /usr/local/sbin/workforce-deploy < .verification/release/release.json
